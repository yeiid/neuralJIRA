server {
    listen 3000;
    server_name localhost;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/font-woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com; frame-src 'self' https://cactusnet.com.co https://demo-html-five.vercel.app https://jamuchee.vercel.app; base-uri 'self'; form-action 'self';" always;

    # Clean static routing with true HTTP 404 and zero port-leaking redirects
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com; frame-src 'self' https://cactusnet.com.co https://demo-html-five.vercel.app https://jamuchee.vercel.app; base-uri 'self'; form-action 'self';" always;
    }

    # Immutable cache for hashed Astro build assets
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Long cache for static media/fonts
    location ~* \.(png|jpg|jpeg|webp|avif|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
